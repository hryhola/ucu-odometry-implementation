readme = "README.md"
authors = [
    { name = "bohdan", email = "howchromium@gmail.com" },
    { name = "vladyslav", email = "vladyslav.hryhola@gmail.com" },
    { name = "markiyan", email = "markiyan.jatsishin@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
